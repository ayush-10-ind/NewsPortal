<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Change Password - News Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container mt-5">

    <div class="card mx-auto shadow"
         style="max-width: 600px;">

        <div class="card-header bg-dark text-white">

            <h3 class="mb-0">
                🔐 Change Password
            </h3>

        </div>


        <div class="card-body p-4">


            <!-- ERROR -->

            <div
                th:if="${error}"
                class="alert alert-danger"
                th:text="${error}">

                Error

            </div>


            <form
                th:action="@{/profile/change-password}"
                th:object="${passwordChange}"
                method="post">


                <!-- CURRENT -->

                <div class="mb-3">

                    <label class="form-label">
                        Current Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        th:field="*{currentPassword}"
                        required>

                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('currentPassword')}"
                        th:errors="*{currentPassword}">
                    </div>

                </div>


                <!-- NEW -->

                <div class="mb-3">

                    <label class="form-label">
                        New Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        th:field="*{newPassword}"
                        required>

                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('newPassword')}"
                        th:errors="*{newPassword}">
                    </div>

                </div>


                <!-- CONFIRM -->

                <div class="mb-4">

                    <label class="form-label">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        th:field="*{confirmPassword}"
                        required>

                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('confirmPassword')}"
                        th:errors="*{confirmPassword}">
                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Change Password

                </button>


                <a
                    href="/profile"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
