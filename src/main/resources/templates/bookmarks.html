<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Saved News - News Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            background: #f8f9fa;
        }


        .hero {

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #6610f2
                );

            color: white;

            padding: 60px 0;

            text-align: center;
        }


        .saved-card {

            border: none;

            border-radius: 15px;

            transition: .3s;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, .08);
        }


        .saved-card:hover {

            transform: translateY(-5px);

            box-shadow:
                0 15px 30px
                rgba(0, 0, 0, .14);
        }


        .category {

            display: inline-block;

            background: #0d6efd;

            color: white;

            padding: 5px 12px;

            border-radius: 20px;

            font-size: 12px;
        }


        footer {

            margin-top: 70px;
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<div th:replace="~{fragments/navbar :: navbar}">
</div>



<!-- HERO -->

<section class="hero">

    <div class="container">

        <h1 class="display-5 fw-bold">
            🔖 Saved News
        </h1>

        <p class="lead mb-0">
            Your bookmarked articles
        </p>

    </div>

</section>



<!-- CONTENT -->

<div class="container my-5">


    <!-- NO SAVED NEWS -->

    <div
        th:if="${#lists.isEmpty(bookmarks)}"
        class="text-center py-5">

        <div style="font-size: 70px;">
            🔖
        </div>

        <h3 class="mt-3">
            No saved articles yet
        </h3>

        <p class="text-muted">
            Articles you bookmark will appear here.
        </p>

        <a
            href="/newsList"
            class="btn btn-primary">

            Browse News

        </a>

    </div>



    <!-- SAVED NEWS -->

    <div
        class="row g-4"
        th:unless="${#lists.isEmpty(bookmarks)}">


        <div
            class="col-lg-4 col-md-6"
            th:each="bookmark : ${bookmarks}">


            <div class="card
                        saved-card
                        h-100">


                <div class="card-body d-flex flex-column">


                    <!-- CATEGORY -->

                    <div class="mb-3">

                        <span
                            class="category"
                            th:text="${bookmark.news.category != null
                                ? bookmark.news.category
                                : 'General'}">

                            Technology

                        </span>

                    </div>


                    <!-- TITLE -->

                    <h4 class="fw-bold">

                        <a
                            th:href="@{/viewNews/{id}(id=${bookmark.news.id})}"
                            class="text-decoration-none text-dark"
                            th:text="${bookmark.news.title}">

                            News Title

                        </a>

                    </h4>


                    <!-- AUTHOR -->

                    <p class="text-muted mb-2">

                        👤

                        <span
                            th:text="${bookmark.news.author}">

                            Author

                        </span>

                    </p>


                    <!-- DATE -->

                    <p class="text-muted">

                        📅

                        <span
                            th:text="${bookmark.news.publishedDate}">

                            Date

                        </span>

                    </p>


                    <!-- ACTIONS -->

                    <div class="mt-auto pt-3">


                        <a
                            th:href="@{/viewNews/{id}(id=${bookmark.news.id})}"
                            class="btn btn-primary me-1">

                            Read Article

                        </a>


                        <form
                            th:action="@{/bookmarks/remove/{id}(id=${bookmark.news.id})}"
                            method="post"
                            class="d-inline">


                            <button
                                type="submit"
                                class="btn btn-outline-danger">

                                Remove

                            </button>


                        </form>


                    </div>


                </div>

            </div>


        </div>


    </div>

</div>



<!-- FOOTER -->

<footer
    class="bg-dark
           text-white
           text-center
           p-3">

    © 2026 News Portal | Developed by Ayush Trivedi

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
