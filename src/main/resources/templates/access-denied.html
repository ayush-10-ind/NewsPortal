<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Access Denied - News Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #6610f2
                );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .access-card {

            width: 430px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);

            animation: popup 0.3s ease;
        }

        .icon {

            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #ffe5e5;

            color: #dc3545;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 40px;
        }

        .access-card h2 {

            font-weight: bold;

            margin-bottom: 15px;
        }

        .access-card p {

            color: #6c757d;

            font-size: 17px;

            margin-bottom: 25px;
        }

        @keyframes popup {

            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

    </style>

</head>

<body>

<div class="access-card">

    <div class="icon">
        🔒
    </div>

    <h2>
        Access Denied
    </h2>

    <p>
        You don't have permission to perform this action.
    </p>

    <p>
        Please contact an administrator if you believe
        you should have access.
    </p>

    <a
        href="/"
        class="btn btn-primary">

        Back to Home

    </a>

    <a
        href="/newsList"
        class="btn btn-outline-secondary ms-2">

        View News

    </a>

</div>

</body>

</html>
