<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit News - News Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f8f9fa;
        }

        .form-container {
            max-width: 800px;
            margin: 50px auto;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,.1);
        }

        .header {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
            color: #212529;
            padding: 30px;
            border-radius: 15px 15px 0 0;
        }

    </style>

</head>


<body>


<!-- SHARED NAVBAR -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container form-container">

    <div class="card">


        <div class="header">

            <h2>
                Edit News Article
            </h2>

            <p class="mb-0">
                Update the article information
            </p>

        </div>


        <div class="card-body p-4">


            <form th:action="@{/updateNews}"
                  th:object="${news}"
                  method="post">


                <!-- ID -->

                <input type="hidden"
                       th:field="*{id}">


                <!-- TITLE -->

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        News Title
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{title}"
                           required>

                </div>


                <!-- AUTHOR -->

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Author
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{author}"
                           required>

                </div>


                <!-- CATEGORY -->

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Category
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{category}"
                           required>

                </div>
<!-- IMAGE URL -->

<div class="mb-3">

    <label class="form-label fw-bold">
        News Image
    </label>

    <input
        type="text"
        class="form-control"
        th:field="*{imageUrl}"
        placeholder="/images/fifa.jpeg">

    <div class="form-text">
        Example: /images/fifa.jpeg
    </div>

</div>

                <!-- CONTENT -->

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        News Content
                    </label>

                    <textarea class="form-control"
                              rows="8"
                              th:field="*{content}"
                              required></textarea>

                </div>


                <!-- DATE -->

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        Published Date
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{publishedDate}"
                           required>

                </div>


                <button type="submit"
                        class="btn btn-warning px-4">

                    Update News

                </button>


                <a href="/newsList"
                   class="btn btn-secondary px-4">

                    Cancel

                </a>


            </form>


        </div>

    </div>

</div>


<footer class="bg-dark text-white text-center p-3 mt-5">

    © 2026 News Portal | Developed by Ayush Trivedi

</footer>


</body>

</html>
