<!DOCTYPE html>

<body>

<nav th:fragment="navbar"

        <!-- =====================================================

                        <!-- SUN RAYS -->

                            stroke-linecap="round">

                            <path d="M60 8V16"/>
                            <path d="M60 56V63"/>
                            <path d="M32 36H40"/>
                            <path d="M80 36H88"/>
                            <path d="M40 16L46 22"/>
                            <path d="M74 50L80 56"/>
                            <path d="M80 16L74 22"/>

                        </g>


                        <!-- CLOUD -->

                                C36 52 38 52.4 40 53.1
                                C43 45 50 39 59 39

        <!-- =====================================================
             RIGHT SIDE NAV ACTIONS
             ===================================================== -->

        <div class="nav-actions">


            <!-- =================================================

                 ================================================= -->

            <a href="/newsList"
               class="nav-search"
               aria-label="Search news">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true">

                    <circle
                        cx="11"
                        cy="11"
                        r="6.5">
                    </circle>

                    <path
                        d="M16 16L21 21">
                    </path>

                </svg>

            </a>


            <!-- =================================================
                 ADD NEWS
                 ================================================= -->

            <a href="/addNews"

            </a>


            <!-- =================================================
                 ADMIN
                 ================================================= -->

            <a href="/admin/users"
               class="nav-editor-link"

                ADMIN

            </a>


            <!-- =================================================
                 NOTIFICATIONS
                 ================================================= -->

            <a href="/notifications"
               class="nav-notification"
               sec:authorize="isAuthenticated()"
               aria-label="Notifications">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true">

                    <path
                        d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9">
                    </path>

                    <path
                        d="M10 21h4">
                    </path>

                </svg>


                <span
                    th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                    th:text="${unreadNotificationCount}"
                    class="notification-count">

                    0

                </span>

            </a>


            <!-- =================================================
                 USER MENU
                 ================================================= -->

            <div class="user-menu"
                 sec:authorize="isAuthenticated()">


                <!-- =================================================
                     USER TRIGGER
                     ================================================= -->

                <button
                    type="button"
                    class="user-trigger"
                    id="userMenuButton"
                    aria-label="Open account menu"
                    aria-expanded="false">

                    <span
                        class="user-initial"
                        sec:authentication="name">

                        U

                    </span>

                    <span
                        class="user-name"
                        sec:authentication="name">

                        User

                    </span>


                    <!-- CHEVRON -->

                    <span
                        class="user-chevron"
                        aria-hidden="true">

                        <svg
                            viewBox="0 0 24 24"
                            width="15"
                            height="15"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round">

                            <polyline points="6 9 12 15 18 9">
                            </polyline>

                        </svg>

                    </span>

                </button>


                <!-- =================================================
                     ACCOUNT DROPDOWN
                     ================================================= -->

                <div
                    class="user-dropdown"
                    id="userDropdown"
                    role="menu">


                    <!-- =================================================
                         ACCOUNT HEADER
                         ================================================= -->

                    <div class="dropdown-user">

                        <span class="dropdown-label">
                            SIGNED IN AS
                        </span>

                        <strong sec:authentication="name">
                            user@example.com
                        </strong>

                    </div>


                    <!-- =================================================
                         MAIN ACCOUNT LINKS
                         ================================================= -->

                    <div class="dropdown-links">


                        <!-- DASHBOARD -->

                        <a
                            href="/dashboard"
                            class="dropdown-item"
                            role="menuitem">

                            <span class="dropdown-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">

                                    <rect
                                        x="3"
                                        y="3"
                                        width="7"
                                        height="7">
                                    </rect>

                                    <rect
                                        x="14"
                                        y="3"
                                        width="7"
                                        height="7">
                                    </rect>

                                    <rect
                                        x="3"
                                        y="14"
                                        width="7"
                                        height="7">
                                    </rect>

                                    <rect
                                        x="14"
                                        y="14"
                                        width="7"
                                        height="7">
                                    </rect>

                                </svg>

                            </span>

                            <span>
                                Dashboard
                            </span>

                        </a>


                        <!-- SAVED NEWS -->

                        <a
                            href="/bookmarks"
                            class="dropdown-item"
                            role="menuitem">

                            <span class="dropdown-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">

                                    <path
                                        d="M6 3h12v18l-6-4-6 4z">
                                    </path>

                                </svg>

                            </span>

                            <span>
                                Saved News
                            </span>

                        </a>


                        <!-- NOTIFICATIONS -->

                        <a
                            href="/notifications"
                            class="dropdown-item"
                            role="menuitem">

                            <span class="dropdown-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">

                                    <path
                                        d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9">
                                    </path>

                                    <path
                                        d="M10 21h4">
                                    </path>

                                </svg>

                            </span>

                            <span>
                                Notifications
                            </span>


                            <!-- NOTIFICATION COUNT -->

                            <span
                                class="dropdown-count"
                                th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                                th:text="${unreadNotificationCount}">

                                0

                            </span>

                        </a>


                        <!-- MY PROFILE -->

                        <a
                            href="/profile"
                            class="dropdown-item"
                            role="menuitem">

                            <span class="dropdown-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">

                                    <circle
                                        cx="12"
                                        cy="8"
                                        r="4">
                                    </circle>

                                    <path
                                        d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7">
                                    </path>

                                </svg>

                            </span>

                            <span>
                                My Profile
                            </span>

                        </a>

                    </div>


                    <!-- =================================================
                         ADMIN SECTION
                         ================================================= -->

                    <div
                        class="dropdown-section"
                        sec:authorize="hasRole('ADMIN')">

                        <a
                            href="/admin/users"
                            class="dropdown-item"
                            role="menuitem">

                            <span class="dropdown-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">

                    <!-- =================================================

                         ================================================= -->

                    <div class="dropdown-section logout-section">

                        <form
                            th:action="@{/logout}"

                            <button
                                type="submit"

                                        viewBox="0 0 24 24"

                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"

            <!-- =================================================
                 MOBILE MENU BUTTON
                 ================================================= -->

            <button
                type="button"
                class="mobile-menu-button"

                <span></span>

    <!-- =========================================================

         ========================================================= -->

        <a href="/">

        </a>

        <a href="/newsList">
            NEWS
        </a>

        <a href="/newsList?category=India">
            INDIA
        </a>

        <a href="/newsList?category=World">
            WORLD
        </a>

        <a href="/newsList?category=Technology">
            TECHNOLOGY
        </a>

        <a href="/newsList?category=Business">
            BUSINESS
        </a>

        <a href="/newsList?category=Sports">
            SPORTS
        </a>


        <!-- =====================================================
             MOBILE WEATHER
             ===================================================== -->

        <a
            href="/weather"
            class="weather-nav-link">

            <span class="weather-nav-icon-wrap">

                <svg
                    class="weather-nav-icon"
                    viewBox="0 0 96 96"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true">


                    <!-- SUN -->

                    <circle
                        cx="60"
                        cy="36"
                        r="18"
                        fill="#FFD83D"
                        stroke="#172B3F"
                        stroke-width="3">
                    </circle>


                    <!-- SUN RAYS -->

                    <g
                        stroke="#172B3F"
                        stroke-width="3.5"
                        stroke-linecap="round">

                        <path d="M60 8V16"/>
                        <path d="M60 56V63"/>
                        <path d="M32 36H40"/>
                        <path d="M80 36H88"/>
                        <path d="M40 16L46 22"/>
                        <path d="M74 50L80 56"/>
                        <path d="M80 16L74 22"/>

                    </g>


                    <!-- CLOUD -->

                    <path
                        d="
                            M18 68
                            C18 59 25 52 34 52
                            C36 52 38 52.4 40 53.1
                            C43 45 50 39 59 39
                            C70 39 79 47 80 58
                            C88 58 94 64 94 72
                            C94 80 88 86 80 86
                            H34
                            C25 86 18 80 18 72
                            Z
                        "
                        fill="#FFFFFF"
                        stroke="#172B3F"
                        stroke-width="3"
                        stroke-linejoin="round">
                    </path>

                </svg>

            </span>

            <span class="weather-nav-text">
                WEATHER
            </span>

        </a>


        <!-- MOBILE ADD NEWS -->

        <a
            href="/addNews"
            sec:authorize="hasAnyRole('EDITOR', 'ADMIN')">

            ADD NEWS

        </a>


        <!-- MOBILE ADMIN -->

        <a
            href="/admin/users"
            sec:authorize="hasRole('ADMIN')">

            ADMIN

        </a>

    </div>

</nav>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const userMenu = document.querySelector(".user-menu");
    const userMenuButton = document.getElementById("userMenuButton");
    const userDropdown = document.getElementById("userDropdown");

    if (!userMenu || !userMenuButton || !userDropdown) {
        return;
    }

    // Open / close user dropdown
    userMenuButton.addEventListener("click", function (event) {
        event.stopPropagation();

        const isOpen = userMenu.classList.toggle("open");

        userMenuButton.setAttribute(
            "aria-expanded",
            isOpen ? "true" : "false"
        );

        userDropdown.setAttribute(
            "aria-hidden",
            isOpen ? "false" : "true"
        );
    });

    // Prevent clicks inside dropdown from closing it
    userDropdown.addEventListener("click", function (event) {
        event.stopPropagation();
    });

    // Close when clicking anywhere outside
    document.addEventListener("click", function () {
        userMenu.classList.remove("open");

        userMenuButton.setAttribute(
            "aria-expanded",
            "false"
        );

        userDropdown.setAttribute(
            "aria-hidden",
            "true"
        );
    });

    // Close with Escape
    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            userMenu.classList.remove("open");

            userMenuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            userDropdown.setAttribute(
                "aria-hidden",
                "true"
            );

            userMenuButton.focus();
        }
    });

});
</script>

</body>

</html>
