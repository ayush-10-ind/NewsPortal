<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile — News Portal</title>

    <link rel="stylesheet"
          th:href="@{/newsportal.css}">

    <style>

        .edit-profile-page {
            min-height: calc(100vh - 76px);
            background: var(--paper);
            padding: 70px 0 100px;
        }

        .edit-profile-wrapper {
            width: min(720px, calc(100% - 64px));
            margin: 0 auto;
        }

        .edit-kicker {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 18px;

            color: var(--accent);

            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .edit-kicker::before {
            content: "";
            width: 38px;
            height: 1px;
            background: var(--accent);
        }

        .edit-title {
            margin: 0 0 42px;

            font-family: var(--serif);
            font-size: clamp(55px, 7vw, 86px);
            font-weight: 400;
            line-height: .9;
            letter-spacing: -4px;
        }

        .edit-card {
            background: var(--paper-light);
            border: 1px solid var(--line);
        }

        .edit-card-header {
            padding: 28px 36px;
            border-bottom: 1px solid var(--line);
        }

        .edit-card-header h2 {
            margin: 0;

            font-family: var(--serif);
            font-size: 28px;
            font-weight: 400;
        }

        .edit-card-header p {
            margin: 5px 0 0;

            color: var(--muted);
            font-size: 12px;
        }

        .edit-form {
            padding: 36px;
        }

        .form-field {
            margin-bottom: 26px;
        }

        .form-field label {
            display: block;
            margin-bottom: 8px;

            color: var(--muted);

            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.3px;
            text-transform: uppercase;
        }

        .form-field input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid var(--line);
            border-radius: 0;

            background: var(--paper);

            color: var(--ink);

            outline: none;

            transition:
                border-color .2s ease,
                background .2s ease;
        }

        .form-field input:focus {
            border-color: var(--ink);
            background: white;
        }

        .form-field input:disabled {
            background: #eeebe4;
            color: var(--muted);
            cursor: not-allowed;
        }

        .form-help {
            display: block;
            margin-top: 7px;

            color: var(--muted);
            font-size: 11px;
        }

        .form-error {
            display: block;
            margin-top: 7px;

            color: #a33a32;
            font-size: 11px;
        }

        .edit-actions {
            display: flex;
            gap: 12px;
            margin-top: 34px;
        }

        .edit-button {
            min-height: 46px;
            padding: 0 20px;

            border: 1px solid var(--ink);

            cursor: pointer;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .edit-button-save {
            background: var(--ink);
            color: var(--paper);
        }

        .edit-button-save:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .edit-button-cancel {
            display: inline-flex;
            align-items: center;

            background: transparent;
            color: var(--ink);
        }

        .edit-button-cancel:hover {
            background: var(--ink);
            color: var(--paper);
        }

        @media (max-width: 650px) {

            .edit-profile-page {
                padding: 45px 0 70px;
            }

            .edit-profile-wrapper {
                width: min(100% - 32px, 720px);
            }

            .edit-title {
                font-size: 52px;
                letter-spacing: -2.5px;
            }

            .edit-card-header,
            .edit-form {
                padding: 24px 20px;
            }

            .edit-actions {
                flex-direction: column;
            }

            .edit-button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="edit-profile-page">

    <div class="edit-profile-wrapper">

        <div class="edit-kicker">
            Account Settings
        </div>

        <h1 class="edit-title">
            Edit Profile
        </h1>


        <section class="edit-card">

            <div class="edit-card-header">

                <h2>
                    Personal Information
                </h2>

                <p>
                    Update the information associated with your account.
                </p>

            </div>


            <form
                class="edit-form"
                th:action="@{/profile/edit}"
                th:object="${profileUpdate}"
                method="post">


                <!-- NAME -->

                <div class="form-field">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        id="name"
                        type="text"
                        th:field="*{name}"
                        autocomplete="name"
                        required>

                    <span
                        class="form-error"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                    </span>

                </div>


                <!-- EMAIL -->

                <div class="form-field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        id="email"
                        type="email"
                        th:value="${user.email}"
                        disabled>

                    <span class="form-help">
                        Your email address cannot be changed from this page.
                    </span>

                </div>


                <!-- PHONE -->

                <div class="form-field">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        id="phone"
                        type="text"
                        th:field="*{phone}"
                        autocomplete="tel"
                        placeholder="Enter your phone number">

                    <span
                        class="form-error"
                        th:if="${#fields.hasErrors('phone')}"
                        th:errors="*{phone}">
                    </span>

                </div>


                <!-- ACTIONS -->

                <div class="edit-actions">

                    <button
                        type="submit"
                        class="edit-button edit-button-save">

                        Save Changes

                    </button>

                    <a
                        href="/profile"
                        class="edit-button edit-button-cancel">

                        Cancel

                    </a>

                </div>

            </form>

        </section>

    </div>

</main>


<footer class="site-footer">

    <div class="editorial-container footer-bottom">

        <span>
            © 2026 News Portal
        </span>

        <span>
            Developed by Ayush Trivedi
        </span>

    </div>

</footer>


<script th:src="@{/newsportal.js}"></script>

</body>

</html>
