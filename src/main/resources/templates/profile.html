<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>My Profile - News Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .profile-container {
            max-width: 800px;
            margin: 60px auto;
        }

        .profile-card {
            background: white;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(
                135deg,
                #0d6efd,
                #6610f2
            );

            color: white;
            padding: 40px;
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: white;
            color: #0d6efd;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
            margin: 0 auto 15px;
        }

        .info-row {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .info-label {
            font-weight: bold;
            color: #6c757d;
        }

    </style>

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container profile-container">

    <div class="profile-card">

        <div class="profile-header">

            <div class="avatar">
                👤
            </div>

            <h2 th:text="${user.name}">
                User
            </h2>

            <p class="mb-0"
               th:text="${user.email}">
                user@example.com
            </p>

        </div>


        <div class="card-body p-4">

            <!-- SUCCESS -->

            <div
                th:if="${param.updated}"
                class="alert alert-success">

                Profile updated successfully.

            </div>


            <div
                th:if="${param.passwordChanged}"
                class="alert alert-success">

                Password changed successfully.

            </div>


            <h4 class="mb-4">
                Account Information
            </h4>


            <!-- NAME -->

            <div class="info-row row">

                <div class="col-sm-4 info-label">
                    Name
                </div>

                <div class="col-sm-8"
                     th:text="${user.name}">

                    User

                </div>

            </div>


            <!-- EMAIL -->

            <div class="info-row row">

                <div class="col-sm-4 info-label">
                    Email
                </div>

                <div class="col-sm-8"
                     th:text="${user.email}">

                    user@example.com

                </div>

            </div>


            <!-- PHONE -->

            <div class="info-row row">

                <div class="col-sm-4 info-label">
                    Phone
                </div>

                <div class="col-sm-8">

                    <span
                        th:if="${user.phone != null and !user.phone.isEmpty()}"
                        th:text="${user.phone}">
                    </span>

                    <span
                        th:unless="${user.phone != null and !user.phone.isEmpty()}"
                        class="text-muted">

                        Not provided

                    </span>

                </div>

            </div>


            <!-- ROLE -->

            <div class="info-row row">

                <div class="col-sm-4 info-label">
                    Role
                </div>

                <div class="col-sm-8">

                    <span
                        th:each="role : ${user.roles}"
                        class="badge bg-primary me-1"
                        th:text="${role.name}">
                    </span>

                </div>

            </div>


            <!-- STATUS -->

            <div class="info-row row">

                <div class="col-sm-4 info-label">
                    Status
                </div>

                <div class="col-sm-8">

                    <span
                        th:if="${user.enabled}"
                        class="badge bg-success">

                        Active

                    </span>

                    <span
                        th:unless="${user.enabled}"
                        class="badge bg-danger">

                        Disabled

                    </span>

                </div>

            </div>


            <!-- CREATED -->

            <div class="info-row row">

                <div class="col-sm-4 info-label">
                    Member Since
                </div>

                <div class="col-sm-8"
                     th:text="${user.createdAt}">

                    Date

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="mt-4 d-flex gap-2">

                <a
                    href="/profile/edit"
                    class="btn btn-primary">

                    ✏️ Edit Profile

                </a>

                <a
                    href="/profile/change-password"
                    class="btn btn-outline-secondary">

                    🔐 Change Password

                </a>

            </div>

        </div>

    </div>

</div>


<footer class="bg-dark text-white text-center p-3 mt-5">

    © 2026 News Portal | Developed by Ayush Trivedi

</footer>

</body>

</html>
