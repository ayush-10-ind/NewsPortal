<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>User Management - News Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .dashboard-header {
            background: linear-gradient(
                135deg,
                #0d6efd,
                #6610f2
            );

            color: white;
            padding: 60px 0;
            margin-bottom: 40px;
        }

        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 25px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);
        }

        .table {
            vertical-align: middle;
        }

        .role-badge {
            font-size: 12px;
        }

    </style>

</head>

<body>

<!-- SHARED NAVBAR -->

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- HEADER -->

<section class="dashboard-header">

    <div class="container">

        <h1 class="fw-bold">
            👑 Admin Dashboard
        </h1>

        <p class="lead mb-0">
            Manage users and their permissions
        </p>

    </div>

</section>


<!-- CONTENT -->

<div class="container mb-5">

    <div class="dashboard-card">

        <div class="d-flex
                    justify-content-between
                    align-items-center
                    mb-4">

            <div>

                <h3 class="mb-1">
                    User Management
                </h3>

                <p class="text-muted mb-0">
                    Manage registered users and roles.
                </p>

            </div>

            <span class="badge bg-primary">

                Total Users:
                <span th:text="${users.size()}">
                    0
                </span>

            </span>

        </div>


        <div class="table-responsive">

            <table class="table table-hover">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Roles</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody>

                    <tr th:each="user : ${users}">

                        <td th:text="${user.id}">
                            1
                        </td>

                        <td th:text="${user.name}">
                            User
                        </td>

                        <td th:text="${user.email}">
                            user@example.com
                        </td>

                        <td>

                            <span
                                th:each="role : ${user.roles}"
                                class="badge bg-primary role-badge me-1"
                                th:text="${role.name}">
                                ROLE_USER
                            </span>

                        </td>

                        <td>

                            <span
                                th:if="${user.enabled}"
                                class="badge bg-success">

                                Active

                            </span>

                            <span
                                th:unless="${user.enabled}"
                                class="badge bg-danger">

                                Disabled

                            </span>

                        </td>

<td>

    <!-- ADMIN ACCOUNT -->

    <span
        th:if="${#sets.contains(user.roles.![name], 'ROLE_ADMIN')}"
        class="badge bg-secondary">

        Protected

    </span>


    <!-- NORMAL USER ACTIONS -->

    <div
        th:unless="${#sets.contains(user.roles.![name], 'ROLE_ADMIN')}"
        class="d-flex gap-2">


        <!-- ROLE -->

        <form
            th:action="@{/admin/users/change-role}"
            method="post"
            class="d-flex gap-1">

            <input
                type="hidden"
                name="userId"
                th:value="${user.id}">


            <select
                name="roleName"
                class="form-select form-select-sm">

                <option
                    value="ROLE_USER"
                    th:selected="${#sets.contains(user.roles.![name], 'ROLE_USER')}">

                    User

                </option>

                <option
                    value="ROLE_EDITOR"
                    th:selected="${#sets.contains(user.roles.![name], 'ROLE_EDITOR')}">

                    Editor

                </option>

            </select>


            <button
                type="submit"
                class="btn btn-sm btn-primary">

                Save

            </button>

        </form>


        <!-- ENABLE / DISABLE -->

        <form
            th:action="@{/admin/users/toggle-status}"
            method="post">

            <input
                type="hidden"
                name="userId"
                th:value="${user.id}">


            <button
                type="submit"
                class="btn btn-sm"
                th:classappend="${user.enabled}
                    ? 'btn-outline-danger'
                    : 'btn-outline-success'">

                <span th:if="${user.enabled}">
                    Disable
                </span>

                <span th:unless="${user.enabled}">
                    Enable
                </span>

            </button>

        </form>

    </div>

</td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<footer
    class="bg-dark text-white text-center p-3">

    © 2026 News Portal

</footer>

</body>

</html>
