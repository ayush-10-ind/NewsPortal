# Railway provides PORT at runtime. Keep a local development fallback on 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# Railway terminates HTTPS at the proxy. Preserve the original scheme/host
# so OAuth callback URLs are generated with the public HTTPS address.
server.forward-headers-strategy=framework

# OAuth scopes required by the custom provider account services.
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# NASA image resolution is page-based by default and does not require a NASA API key.
# Set NASA_API_KEY only if APOD API fallback is desired for APOD articles.
nasa.api-key=${NASA_API_KEY:}
