<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Notifications - News Portal</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            background: #f5f7fb;
        }


        .notification-container {

            max-width: 900px;

            margin: 60px auto;
        }


        .notification-card {

            background: white;

            border-radius: 16px;

            padding: 20px;

            margin-bottom: 15px;

            box-shadow:
                0 6px 20px
                rgba(0, 0, 0, .07);

            transition: .2s;
        }


        .notification-card:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, .10);
        }


        .notification-unread {

            border-left:
                5px solid #0d6efd;

            background: #eef5ff;
        }


        .notification-icon {

            width: 50px;

            height: 50px;

            border-radius: 50%;

            background: #e9f2ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

            flex-shrink: 0;
        }


        footer {

            margin-top: 70px;
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<div
    th:replace="~{fragments/navbar :: navbar}">
</div>


<div class="container notification-container">


    <!-- HEADER -->

    <div
        class="d-flex
               justify-content-between
               align-items-center
               mb-4">

        <div>

            <h2 class="fw-bold">

                🔔 Notifications

            </h2>

            <p class="text-muted mb-0">

                Stay updated with your News Portal activity.

            </p>

        </div>


        <form
            th:if="${unreadCount > 0}"
            th:action="@{/notifications/read-all}"
            method="post">

            <button
                type="submit"
                class="btn btn-outline-primary">

                ✓ Mark All Read

            </button>

        </form>

    </div>


    <!-- NO NOTIFICATIONS -->

    <div
        th:if="${#lists.isEmpty(notifications)}"
        class="text-center bg-white rounded-4 p-5 shadow-sm">

        <div style="font-size:60px;">

            🔔

        </div>

        <h4 class="mt-3">

            No notifications

        </h4>

        <p class="text-muted">

            You're all caught up!

        </p>

    </div>


    <!-- NOTIFICATIONS -->

    <div
        th:each="notification : ${notifications}"
        class="notification-card"
        th:classappend="${!notification.read
            ? ' notification-unread'
            : ''}">


        <div
            class="d-flex
                   gap-3
                   align-items-start">


            <!-- ICON -->

            <div class="notification-icon">

                🔔

            </div>


            <!-- CONTENT -->

            <div class="flex-grow-1">


                <div
                    class="d-flex
                           justify-content-between
                           align-items-start">


                    <div>

                        <h5
                            class="mb-1 fw-bold"
                            th:text="${notification.title}">

                            Notification

                        </h5>


                        <p
                            class="mb-2 text-muted"
                            th:text="${notification.message}">

                            Notification message

                        </p>

                    </div>


                    <!-- UNREAD -->

                    <span
                        th:if="${!notification.read}"
                        class="badge bg-primary">

                        New

                    </span>

                </div>


                <!-- TIME -->

                <small class="text-muted">

                    🕐

                    <span
                        th:text="${notification.createdAt}">

                        Date

                    </span>

                </small>


                <!-- ACTIONS -->

                <div class="mt-3">


                    <a
                        th:if="${!notification.read}"
                        th:href="@{/notifications/read/{id}(id=${notification.id})}"
                        class="btn btn-sm btn-primary me-2">

                        Mark as Read

                    </a>


                    <a
                        th:if="${notification.link != null
                            and !notification.link.isEmpty()}"
                        th:href="${notification.link}"
                        class="btn btn-sm btn-outline-primary">

                        Open

                    </a>


                    <form
                        th:action="@{/notifications/delete/{id}(id=${notification.id})}"
                        method="post"
                        class="d-inline">

                        <button
                            type="submit"
                            class="btn btn-sm btn-outline-danger">

                            Delete

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<footer
    class="bg-dark
           text-white
           text-center
           p-3">

    © 2026 News Portal | Developed by Ayush Trivedi

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
