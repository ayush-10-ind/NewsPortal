<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Profile - News Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container mt-5">

    <div class="card mx-auto shadow"
         style="max-width: 650px;">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                ✏️ Edit Profile
            </h3>

        </div>


        <div class="card-body p-4">

            <form
                th:action="@{/profile/edit}"
                th:object="${profileUpdate}"
                method="post">


                <!-- NAME -->

                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{name}"
                        required>

                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                    </div>

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        th:value="${#authentication.name}"
                        disabled>

                    <small class="text-muted">
                        Email cannot be changed here.
                    </small>

                </div>


                <!-- PHONE -->

                <div class="mb-4">

                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{phone}"
                        placeholder="Enter phone number">

                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('phone')}"
                        th:errors="*{phone}">
                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Changes

                </button>


                <a
                    href="/profile"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
